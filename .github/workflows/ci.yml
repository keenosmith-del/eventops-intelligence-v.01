name: Deployment checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deployment-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: eventops_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d eventops_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only@127.0.0.1:5432/eventops_ci
      GEMINI_ENABLED: 'false'
      RUN_MAILTRAP_LIVE: 'false'
      DEMO_MODE: 'false'
      LANGSMITH_TRACING: 'false'
      EMBEDDING_THREADS: '1'
      FASTEMBED_CACHE_PATH: /tmp/eventops-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pip check
      - name: Migrate and index synthetic authoritative documents
        working-directory: backend
        run: |
          python -m app.core.migrate
          python -m app.rag.indexing
          python -m app.core.migrate
          python -m app.rag.indexing
      - name: Backend regression (no live generation or Mailtrap)
        working-directory: backend
        run: python -m pytest -q --tb=short
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify hosted build configuration
        run: bash scripts/build-frontend.sh
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - run: npm --prefix frontend test
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression with explicit test fixtures
        working-directory: frontend
        run: npm run test:e2e
        env:
          TEST_PREVIEW: 'true'
